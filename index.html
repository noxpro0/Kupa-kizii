<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kupa kızı // müzik</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            background: url('https://i.pinimg.com/originals/80/7e/1d/807e1d5a711ef06941571d4ddf69c9bf.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            color: #2c3e50;
            position: relative;
        }

        /* Top Bar / Header */
        .header-title {
            font-family: 'Caveat', cursive;
            font-size: 52px;
            color: #2d6a4f;
            margin-top: 10px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .settings-btn {
            position: absolute;
            top: 25px;
            right: 20%;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Floating Nav Bar */
        .nav-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .nav-btn {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .nav-btn.active {
            background: #76c7c0;
            color: white;
        }

        /* Search Box */
        .search-container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 25px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .search-container input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: #333;
        }

        .search-container i {
            color: #2b580c;
            cursor: pointer;
        }

        /* Main Card Container */
        .content-card {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            min-height: 180px;
        }

        .card-header {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #d90429;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .trend-status {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Results List */
        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .track-item img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: #777;
        }

        /* Footer Text */
        .footer-text {
            margin-top: 40px;
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 22px;
            color: #2d6a4f;
            line-height: 1.4;
        }

        .footer-icons {
            margin-top: 5px;
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
        }

        /* Player Bar Hidden Container */
        #youtube-player {
            display: none;
        }

        /* Floating Stickers / Decorative Elements */
        .sticker {
            position: absolute;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <button class="settings-btn" title="Ayarlar"><i class="fas fa-cog"></i></button>

    <h1 class="header-title">kupa kızı</h1>

    <div class="nav-container">
        <button class="nav-btn active" onclick="switchTab('home')"><i class="fas fa-home"></i> Anasayfa</button>
        <button class="nav-btn" onclick="switchTab('records')"><i class="fas fa-folder"></i> Kayıtlarım</button>
        <button class="nav-btn" onclick="switchTab('bg')"><i class="fas fa-image"></i> Arka Plan</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Şarkı ara..." onkeyup="handleSearch(event)">
        <i class="fas fa-search" onclick="executeSearch()"></i>
    </div>

    <div class="content-card">
        <div class="card-header" id="cardTitle">
            🔥 <i>Bu Hafta Türkiye'de Trend</i>
        </div>
        
        <div id="cardBody">
            <div class="trend-status" id="statusMessage">
                trend liste için YouTube API anahtarını ekle 🪵
            </div>
            <div class="results-grid" id="resultsGrid" style="display: none;"></div>
        </div>
    </div>

    <div class="footer-text">
        bu site fatmanur seher (vildan) adlı kişiye aittir.<br>
        o ne hayal ederse bu sitede o olur...
        <div class="footer-icons">
            🌸 🌺 🌷 🌹 🌻
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="youtube-player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const YOUTUBE_API_KEY = "AIzaSyAvaiMCTQ3IZJPxnEwxu4TrpdvU0_CKXBk";
        let player;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
            }
        }

        async function handleSearch(event) {
            if (event.key === 'Enter') {
                executeSearch();
            }
        }

        async function executeSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const statusMsg = document.getElementById('statusMessage');
            const resultsGrid = document.getElementById('resultsGrid');

            statusMsg.style.display = 'block';
            statusMsg.innerText = 'Aranıyor...';
            resultsGrid.style.display = 'none';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    statusMsg.style.display = 'none';
                    resultsGrid.style.display = 'flex';
                    resultsGrid.innerHTML = '';

                    data.items.forEach(item => {
                        const track = {
                            id: item.id.videoId,
                            title: item.snippet.title,
                            artist: item.snippet.channelTitle,
                            cover: item.snippet.thumbnails.default.url
                        };

                        const div = document.createElement('div');
                        div.className = 'track-item';
                        div.onclick = () => playTrack(track.id);
                        div.innerHTML = `
                            <img src="${track.cover}" alt="cover">
                            <div class="track-info">
                                <div class="track-title">${track.title}</div>
                                <div class="track-artist">${track.artist}</div>
                            </div>
                        `;
                        resultsGrid.appendChild(div);
                    });
                } else {
                    statusMsg.innerText = 'Sonuç bulunamadı.';
                }
            } catch (err) {
                statusMsg.innerText = 'Arama sırasında hata oluştu.';
                console.error(err);
            }
        }

        function playTrack(videoId) {
            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
            }
        }

        function switchTab(tab) {
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (tab === 'home') btns[0].classList.add('active');
            if (tab === 'records') btns[1].classList.add('active');
            if (tab === 'bg') btns[2].classList.add('active');
        }
    </script>
</body>
</html>
